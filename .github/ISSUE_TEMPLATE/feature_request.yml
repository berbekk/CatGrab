name: Feature request
description: Suggest an idea for CatGrab
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not just the solution — it often suggests a better fit.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like CatGrab to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do instead today?
