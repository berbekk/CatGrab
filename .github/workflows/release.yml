name: Release

# Тег vX.Y.Z → CatGrab.dmg на странице релиза.
# Подпись необязательна: без секретов сборка подписывается ad-hoc. Секреты — в RELEASING.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    env:
      HAS_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 != '' }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_ID != '' }}
      CATGRAB_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4

      # Стекло Liquid Glass (macOS 26 API) собирается только с SDK из Xcode 26 и новее.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Import signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}

      - name: Build DMG
        env:
          SIGN_IDENTITY: ${{ env.HAS_CERTIFICATE == 'true' && secrets.SIGNING_IDENTITY || '' }}
          NOTARIZE: ${{ env.HAS_NOTARIZATION == 'true' && '1' || '0' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          CATGRAB_BUILD_NUMBER: ${{ github.run_number }}
        run: ./make-dmg.sh

      - name: Verify DMG
        env:
          NOTARIZE: ${{ env.HAS_NOTARIZATION == 'true' && '1' || '0' }}
        run: ./scripts/verify-release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatGrab
          path: build/CatGrab.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/CatGrab.dmg
          fail_on_unmatched_files: true
          body_path: .github/release-notes.md
          generate_release_notes: true
