name: Website

# site/ → https://berbekk.github.io/CatGrab/
# Картинки не дублируются в репозитории: скриншоты и иконка копируются в site/assets при сборке.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "design/icon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p site/assets
          cp docs/screenshots/*.png site/assets/
          cp design/icon.png site/assets/icon.png

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
