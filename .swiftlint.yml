# CatGrab · SwiftLint
# Запуск: `swiftlint lint --config .swiftlint.yml` (требует установленный swiftlint, brew install swiftlint)

included:
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm
  - Sources/CatGrabLib/Services/Localization.swift  # ручной словарь переводов, особый кейс

disabled_rules:
  - trailing_whitespace          # не критично для Swift
  - todo                         # TODO/FIXME по смыслу у нас нет, но хотим свободно оставлять заметки
  - line_length                  # мы уже контролируем через opt_in_rules ниже

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - literal_expression_end_indentation
  - multiline_parameters
  - overridden_super_call
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

analyzer_rules:
  - unused_declaration
  - unused_import

# Файлы обычно длинные из-за SwiftUI views; даём слабину, но ставим жёсткий порог.
file_length:
  warning: 1500
  error: 2500

type_body_length:
  warning: 700
  error: 1200

function_body_length:
  warning: 150
  error: 250

cyclomatic_complexity:
  warning: 14
  error: 25

# Короткие локальные имена (`c`, `s`, `p`) в коде используются осознанно и локально.
identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 60
    error: 80
  excluded:
    - id
    - x
    - y
    - z
    - n
    - m
    - i
    - j
    - k
    - to
    - ok
    - _0   # имя ключа в Codable-представлении enum с ассоциированным значением, менять нельзя

type_name:
  min_length:
    warning: 2
    error: 2
  excluded:
    - DS   # пространство имён дизайн-токенов, короткое намеренно
  max_length:
    warning: 50
    error: 80

# Геометрия секторов и SwiftUI-хелперы естественно принимают много параметров.
function_parameter_count:
  warning: 8
  error: 10

# Кортежи из трёх элементов для (x, y, z)-подобных группировок читаются нормально.
large_tuple:
  warning: 3
  error: 4

# `SettingsView` держит вложенный тип с собственным enum — два уровня допустимы.
nesting:
  type_level:
    warning: 2

# Разрешаем короткие `{ $0 }`.
closure_parameter_position: error

reporter: "xcode"
